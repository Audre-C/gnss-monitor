# GNSS Monitor - Live mode (Raspberry Pi / Linux) configuration.
#
# Identical to config/live_windows.yaml except for the serial device
# names. This file is the ONLY thing that changes when moving from the
# Windows bench to the Pi deployment. The Waveshare USB-to-8CH adapter
# enumerates via the CH9344 driver as /dev/ttyCH9344USB* rather than
# /dev/ttyUSB*; confirm the mapping with `ls -l /dev/ttyCH9344USB*` (or
# `/dev/serial/by-id/`) since USB enumeration order can shift across
# reboots or when the adapter is replugged.

app:
  name: gnss-monitor
  log_dir: logs
  diagnostics_level: INFO

site:
  name: "Teleport Rooftop"
  expected:
    latitude_deg: 25.334373
    longitude_deg: 51.469359
    position_tolerance_m: 100.0
    altitude_m: 40.0
    altitude_tolerance_m: 30.0
    max_speed_mps: 1.0
    receiver_timeout_s: 10.0
    min_satellites: 4
    max_hdop: 5.0

channels:
  - id: neo6m_1
    module: "u-blox NEO-6M"
    name: "NEO-6M"
    constellation: "GPS"
    antenna: "BT-104"
    source:
      type: serial
      port: /dev/ttyCH9344USB1
      baud: 9600

  - id: neom10_1
    module: "Quescan NeoM101612F"
    name: "NeoM10"
    constellation: "GLONASS"
    antenna: "BT-460D"
    source:
      type: serial
      port: /dev/ttyCH9344USB3
      baud: 38400

  - id: lc29h_1
    module: "Quectel LC29HEA"
    name: "LC29HEA"
    constellation: "Galileo"
    antenna: "BT-104L5"
    source:
      type: serial
      port: /dev/ttyCH9344USB2
      baud: 460800
    expected:
      position_tolerance_m: 50.0

  - id: vollgo_1
    module: "VOLLGO VG7779T156N0MA"
    name: "VOLLGO"
    constellation: "BeiDou"
    antenna: "BT-460D"
    source:
      type: serial
      port: /dev/ttyCH9344USB0
      baud: 115200