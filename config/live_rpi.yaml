# GNSS Monitor - Live mode (Raspberry Pi / Linux) configuration.
#
# Identical to config/live_windows.yaml except for the serial device
# names. This file is the ONLY thing that changes when moving from the
# Windows bench to the Pi deployment. The Waveshare USB-to-8CH adapter
# enumerates via the CH9344 driver as /dev/ttyCH9344USB* rather than
# /dev/ttyUSB*; confirm the mapping with `ls -l /dev/ttyCH9344USB*` (or
# `/dev/serial/by-id/`) since USB enumeration order can shift across
# reboots or when the adapter is replugged.
#
# Five receivers: four each configured (externally, at boot) to track a
# single GNSS constellation, plus the LC29HEA which is multi-constellation
# and is therefore marked role: reference rather than given a
# constellation of its own - see ChannelConfig.role.
#
# The `analysis:` section configures the Version 2 scoring engine
# (gnss_monitor.analysis). It is optional - omit it entirely to run
# Simple Mode only - and every value below is a starting point, not a
# calibrated production threshold; tune against real capture data before
# relying on it operationally.
#
# Before running this manually: stop the systemd service first
# (`sudo systemctl stop gnss-monitor`), or a second copy will fight the
# running one over the same serial ports. Two processes (or two channels)
# opening the same device node is what produces pyserial's "device
# reports readiness to read but returned no data (device disconnected or
# multiple access on port?)" - a rapid disconnect/reconnect flap, not a
# real unplug. Prefer the stable /dev/serial/by-id/... names over
# /dev/ttyCH9344USB* where available, since USB enumeration order can
# otherwise shift the mapping across reboots or replugs.

app:
  name: gnss-monitor
  log_dir: logs
  diagnostics_level: INFO

site:
  name: "Teleport Rooftop"
  expected:
    latitude_deg: 25.334373
    longitude_deg: 51.469359
    position_tolerance_m: 100.0
    altitude_m: 40.0
    altitude_tolerance_m: 30.0
    max_speed_mps: 1.0
    receiver_timeout_s: 10.0
    min_satellites: 4
    max_hdop: 5.0

channels:
  - id: neo6m_1
    module: "u-blox NEO-6M"
    name: "NEO-6M"
    constellation: "GPS"
    antenna: "BT-104"
    source:
      type: serial
      port: /dev/ttyCH9344USB1
      baud: 9600

  - id: neom10_1
    module: "Quescan NeoM101612F"
    name: "NeoM10"
    constellation: "Galileo"
    antenna: "BT-460D"
    source:
      type: serial
      port: /dev/ttyCH9344USB3
      baud: 38400

  - id: neom8n_1
    module: "u-blox NEO-M8N"
    name: "NEO-M8N"
    constellation: "GLONASS"
    source:
      type: serial
      port: /dev/ttyCH9344USB4
      baud: 9600

  - id: lc29h_1
    module: "Quectel LC29HEA"
    name: "LC29HEA"
    constellation: "Reference"
    role: reference
    antenna: "BT-104L5"
    source:
      type: serial
      port: /dev/ttyCH9344USB2
      baud: 460800
    expected:
      position_tolerance_m: 50.0

  - id: vollgo_1
    module: "VOLLGO VG7779T156N0MA"
    name: "VOLLGO"
    constellation: "BeiDou"
    antenna: "BT-460D"
    source:
      type: serial
      port: /dev/ttyCH9344USB0
      baud: 115200

analysis:
  position:
    warning_radius_m: 100
    failure_radius_m: 500
    weight_warning: 20
    weight_failure: 40
  no_fix:
    weight: 30
  speed:
    stationary_speed_limit_kmh: 5
    warning_speed_kmh: 10
    weight: 25
  satellites:
    minimum: 5
    sudden_drop: 3
    weight: 15
  hdop:
    warning: 2.5
    critical: 5.0
    weight: 20
  time:
    max_jump_seconds: 3
    weight: 30
  disagreement:
    max_distance_between_receivers_m: 100
    weight: 35
  # Placeholders only - calibrate against a known-clean per-receiver
  # capture before relying on this operationally.
  signal:
    min_tracked_satellites: 4
    uniform_std_dbhz: 2.0
    uniform_min_mean_dbhz: 40
    max_mean_cn0_dbhz: 50
    weight: 30
  overall:
    warning: 30
    potential_spoofing: 60
    spoofing: 90
