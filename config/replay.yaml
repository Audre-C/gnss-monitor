# GNSS Monitor - Simple Mode (offline replay) configuration.
#
# Expected position is the surveyed location of the fixed installation.
# For this replay demo it is set to the centroid of the three recorded
# receivers (~5 m agreement). Replace with the real surveyed rooftop
# position before live use.

app:
  name: gnss-monitor
  log_dir: logs
  diagnostics_level: INFO

site:
  name: "Teleport Rooftop"
  expected:
    latitude_deg: 25.334373
    longitude_deg: 51.469359
    position_tolerance_m: 100.0     # allowed radius (metres)
    altitude_m: 40.0
    altitude_tolerance_m: 30.0
    max_speed_mps: 1.0
    receiver_timeout_s: 10.0
    min_satellites: 4
    max_hdop: 5.0

channels:
  - id: neo6m_1
    module: "u-blox NEO-6M"
    name: "GPS (NEO-6M)"
    antenna: "BT-104"
    source:
      type: file
      path: data/nmea_logs/GHA20P-SSI-0720_142510_COM24.log

  - id: lc29h_1
    module: "Quectel LC29HEA"
    name: "Multi-GNSS (LC29H)"
    antenna: "BT-104L5"
    source:
      type: file
      path: data/nmea_logs/GHA20P-SSI-0720_143330_COM21.log
    expected:
      position_tolerance_m: 50.0    # tighter tolerance for RTK-capable unit

  - id: neom10_1
    module: "Quescan NeoM101612F"
    name: "Multi-GNSS (M10)"
    antenna: "BT-460D"
    source:
      type: file
      path: data/nmea_logs/GHA20P-SSI-0720_143953_COM23.log