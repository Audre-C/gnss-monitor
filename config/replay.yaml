# GNSS Monitor - Stage 1 (offline replay) configuration.
#
# Replace site.expected values with the surveyed position of your
# teleport rooftop antennas before real use.

app:
  name: gnss-monitor
  log_dir: logs
  diagnostics_level: INFO

site:
  name: "Teleport Rooftop"
  expected:
    latitude_deg: 25.33436483    #tested as of 2026-Jul-26
    longitude_deg: 51.469346	      #tested as of 2026-Jul-26
    position_tolerance_m: 50.0
    altitude_m: 14.4             #tested as of 2026-Jul-26
    altitude_tolerance_m: 30.0
    max_speed_mps: 1.0
    receiver_timeout_s: 10.0
    min_satellites: 4
    max_hdop: 5.0

channels:
  - id: neo6m_1
    module: "u-blox NEO-6M"
    antenna: "BT-104"
    source:
      type: file
      path: data/nmea_logs/neo6m_sample.nmea
      rate: realtime

  - id: lc29h_1
    module: "Quectel LC29HEA"
    antenna: "BT-104L5"
    source:
      type: file
      path: data/nmea_logs/lc29h_sample.nmea
      rate: realtime
    expected:
      # Dual-band RTK-capable module: tighter expectations.
      position_tolerance_m: 20.0
      min_satellites: 8

  - id: neom10_1
    module: "Quescan NeoM101612F"
    antenna: "BT-460D"
    source:
      type: file
      path: data/nmea_logs/neom10_sample.nmea
      rate: realtime